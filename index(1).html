.fitem.on{background:var(--pen);color:#12263a}.fitem.lock{opacity:.6}
.card.fold>h2:first-child,.card.fold>h3:first-child{cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:0;user-select:none}
.card.fold:not(.shut)>h2:first-child,.card.fold:not(.shut)>h3:first-child{margin-bottom:.6em}
.fa{flex:none;width:28px;height:28px;display:grid;place-items:center;border-radius:50%;background:var(--bg);border:1.5px solid var(--line);font:700 .8rem Onest,sans-serif;transition:transform .2s}
.card.shut .fa{transform:rotate(-90deg)}
.card.shut>*:not(:first-child){display:none!important}
.modal .card{position:relative}
.xbtn{position:absolute;top:8px;right:8px;width:34px;height:34px;padding:0;border-radius:50%;font-size:1rem;z-index:3;background:var(--surface)}
.modal .card>h2:first-child,.modal .card>h3:first-child{padding-right:36px}
.mfab{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:50px;height:50px;border-radius:50%;padding:0;font-size:1.4rem;z-index:40;background:var(--surface);border:2px solid var(--acc);box-shadow:0 4px 0 rgba(0,0,0,.25)}
.mfab.off{border-color:var(--line);opacity:.85}
.mfab.playing{animation:mpulse 2.4s ease-in-out infinite}
@keyframes mpulse{50%{box-shadow:0 4px 0 rgba(0,0,0,.25),0 0 0 7px rgba(31,111,235,.18)}}
input[type=range]{width:100%;accent-color:var(--acc)}
@media (prefers-reduced-motion:reduce){.mfab.playing{animation:none}}
.ladder>div{min-width:0}.ladder b{font-size:.74rem;max-width:100%;overflow-wrap:anywhere}
html,body{overflow-x:hidden}

/* v5 */
.bdg{background:var(--acc);color:var(--acc-ink)}
.bdg.e{background:transparent;color:inherit;font-size:1.1em;min-width:0;padding:0 .1em;border-radius:0}
.avw{position:relative;display:inline-block;flex:none;line-height:0;--s:52px}
.avw.pav{--s:68px}.avw.lg{--s:96px}.avw.sm2{--s:40px}.avw.sm{--s:26px}.avw.cav{--s:56px}
.hat,.gls{position:absolute;left:50%;pointer-events:none;line-height:1;z-index:2}
.hat{bottom:calc(100% - var(--s)*.12);transform:translateX(-50%) rotate(-8deg);font-size:calc(var(--s)*.6)}
.gls{top:50%;transform:translate(-50%,-50%);font-size:calc(var(--s)*.98);white-space:nowrap}
.avw.hh{margin-top:calc(var(--s)*.5)}
.item .ic{min-height:54px}
#toasts{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:60;pointer-events:none;width:max-content;max-width:88vw}
#toasts .toast{position:static;transform:none;animation:rise .25s ease both;text-align:center}
#quit{margin-left:auto;font-size:.85rem;color:var(--mute)}
.fr_leaf{box-shadow:0 0 0 4px #2fbf71,0 0 14px 2px rgba(47,191,113,.7)}
.fr_royal{box-shadow:0 0 0 3px #7b2cbf,0 0 0 6px #f5c518,0 0 14px 4px rgba(123,44,191,.6)}
.fr_cosmic{box-shadow:0 0 0 3px #1b1464,0 0 0 5px #a78bfa,0 0 18px 5px #6d5dfc}
.fr_gem{box-shadow:0 0 0 4px #7cf3ff,0 0 0 6px #fff,0 0 16px 4px #3ec6ff}
.av.fr_leaf,.av.fr_royal,.av.fr_cosmic,.av.fr_gem{border-color:transparent}
.av.sm2.fr_royal,.av.sm2.fr_cosmic,.av.sm2.fr_rainbow,.av.sm2.fr_gem{box-shadow:0 0 0 2px var(--c1,#a78bfa),0 0 8px 2px var(--c2,#6d5dfc)}

/* ===== Mindora classic skin: компактний вигляд першої версії (шапка, вкладки) ===== */
.brand{display:flex;align-items:center;flex-wrap:nowrap;gap:8px;margin-bottom:10px}
.brand>span{line-height:1.2}.brand .plusbtn{margin-top:0;flex:none}
.topr{margin-left:auto;display:flex;flex-direction:row;align-items:center;gap:6px}
.topr .coinb,.topr .shopb{min-width:0;margin:0;padding:5px 10px;font-size:.7rem;white-space:nowrap}
.card.prof{background:none;border:0;box-shadow:none;padding:0;margin-bottom:12px}
.prow{gap:12px}
.av.pav{width:52px;height:52px;font-size:1.3rem}
.prow .nline{font-size:1.05rem}
.prow .chip-elo{font-size:1rem;padding:4px 14px}
.pmeta{margin-top:6px;font-size:.85rem}
.card.prof .rbar{margin-top:6px}
.rbar .bar{height:8px;border-width:1px}
.rbar svg{width:26px;height:auto}
.card.prof .rnext{font-size:.72rem;margin-top:2px}
.tabs{display:flex;gap:6px;padding:5px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;display:block;padding:10px 12px;font-size:.88rem;line-height:1.2;white-space:nowrap;overflow:visible}
.tabs button span{max-width:none;overflow:visible;text-overflow:clip}
.tabs .ti{display:none}
</style>

<body>
<main id="app"></main>
<noscript><p style="padding:24px;font:16px sans-serif">Mindora needs JavaScript to be enabled.</p></noscript>
<script>
/* ============ РЕЄСТР: тут додається все нове ============
   Нова тема задач  -> REGISTRY.topics.push({...})
   Новий режим      -> REGISTRY.modes.push({...})
   Новий “плагін”   -> REGISTRY.hooks.afterGame.push(fn)   (досягнення, бейджі, щоденні задачі…)
*/
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[rnd(0,a.length-1)];
const gcd=(a,b)=>b?gcd(b,a%b):a;
const P=n=>n<0?`(${n})`:`${n}`;
const REGISTRY={
 settings:{startElo:100,K:40,hintMinElo:200,graceSec:10,tasksPerGame:5,lessonsAfterGames:3,weakBelow:0.7},
 modes:[
  {id:'demo',name:'Швидка · 2 хв',sec:120,tasks:1,cap:5},
  {id:'blitz',name:'Бліц · 10 хв',sec:600,tasks:5,cap:15},
  {id:'std',name:'Класика · 30 хв',sec:1800,tasks:15,cap:30}
 ],
 topics:[
  {id:'add',name:'Додавання і віднімання',min:1,
   lesson:'Розбивай числа на розряди: 47 + 38 = 47 + 30 + 8 = 85. Віднімання перевіряй додаванням.',
   gen(L){const a=rnd(10,20+25*L),b=rnd(10,20+25*L);const ta=Math.floor(a/10)*10,tb=Math.floor(b/10)*10;return Math.random()<.5?{text:`${a} + ${b} = ?`,answer:a+b,sol:`Спочатку десятки: ${ta} + ${tb} = ${ta+tb}.<br>Потім одиниці: ${a-ta} + ${b-tb} = ${a-ta+b-tb}.<br>Разом: ${ta+tb} + ${a-ta+b-tb} = <b>${a+b}</b>.`}:{text:`${a+b} − ${b} = ?`,answer:a,sol:`Віднімання перевіряємо додаванням: яке число разом з ${b} дає ${a+b}?<br>${a} + ${b} = ${a+b}, тож відповідь <b>${a}</b>.`}}},
  {id:'mul',name:'Множення',min:1,
   lesson:'Таблиця множення + розклад: 14 × 6 = 10×6 + 4×6 = 60 + 24 = 84.',
   gen(L){const a=rnd(2,5+L),b=rnd(2,6+L);const h=Math.floor(b/2);return {text:`${a} × ${b} = ?`,answer:a*b,sol:`Розбий ${b} на ${h} і ${b-h}.<br>${a} × ${h} = ${a*h}, ${a} × ${b-h} = ${a*(b-h)}.<br>Разом: ${a*h} + ${a*(b-h)} = <b>${a*b}</b>.`}}},
  {id:'eq',name:'Рівняння',min:2,
   lesson:'Щоб знайти невідоме, зроби обернену дію: x + 7 = 20 → x = 20 − 7. Якщо є коефіцієнт — поділи обидві частини.',
   gen(L){if(L<4){const x=rnd(2,10*L),a=rnd(2,10*L);return {text:`x + ${a} = ${x+a}.  x = ?`,answer:x,sol:`Щоб знайти x, віднімаємо ${a} від обох частин.<br>x = ${x+a} − ${a} = <b>${x}</b>.`}}
    const x=rnd(2,6+L),a=rnd(2,9),b=rnd(1,20);return {text:`${a}x + ${b} = ${a*x+b}.  x = ?`,answer:x,sol:`Віднімаємо ${b}: ${a}x = ${a*x+b} − ${b} = ${a*x}.<br>Ділимо на ${a}: x = ${a*x} ÷ ${a} = <b>${x}</b>.`}}},
  {id:'geo',name:'Геометрія',min:2,
   lesson:'Площа прямокутника = a × b (кількість квадратиків всередині). Периметр = 2 × (a + b) (довжина обходу навколо).',
   gen(L){const a=rnd(2,4+2*L),b=rnd(2,4+2*L);const area=Math.random()<.5;
    return {text:`Прямокутник ${a} см × ${b} см. Знайди ${area?'площу':'периметр'} (число).`,answer:area?a*b:2*(a+b),sol:area?`Площа S = a × b.<br>S = ${a} × ${b} = <b>${a*b}</b> см².`:`Периметр P = 2 × (a + b).<br>P = 2 × (${a} + ${b}) = 2 × ${a+b} = <b>${2*(a+b)}</b> см.`,
     words:['площа','периметр','об’єм'],key:area?'площа':'периметр',
     hint:area?'Площа = a × b':'Периметр = 2 × (a + b)'}}},
  {id:'pct',name:'Відсотки',min:4,
   lesson:'10% — це поділити на 10; 50% — на 2; 25% — на 4. Інші відсотки складай з цих.',
   gen(L){const p=pick([10,20,25,50,75]),n=rnd(2,8+L)*20;return {text:`${p}% від ${n} = ?`,answer:n*p/100,sol:`${p}% — це ${p}/100.<br>${n} × ${p} ÷ 100 = <b>${n*p/100}</b>.`,
     words:['частка','добуток сум','відсоток від числа'],key:'відсоток від числа',hint:'p% від n = n × p ÷ 100'}}},
  {id:'pow',name:'Степені й корені',min:5,
   lesson:'a² = a × a. Корінь — обернена дія: √49 = 7, бо 7² = 49.',
   gen(L){const a=rnd(2,6+L);return Math.random()<.5?{text:`${a}² = ?`,answer:a*a,sol:`${a}² = ${a} × ${a} = <b>${a*a}</b>.`}:{text:`√${a*a} = ?`,answer:a,sol:`Яке число в квадраті дає ${a*a}? ${a} × ${a} = ${a*a}, тож <b>${a}</b>.`}}},
  {id:'dec',name:'Десяткові дроби',min:5,
   lesson:'Записуй числа в стовпчик так, щоб кома стояла під комою.',
   gen(L){const a=rnd(11,99)/10,b=rnd(11,99)/10,r=Math.round((a+b)*10)/10;return {text:`${a} + ${b} = ?`,answer:r,sol:`Кома під комою: ${a} + ${b} = <b>${r}</b>.`}}},
  {id:'quad',name:'Квадратні рівняння',min:8,
   lesson:'За теоремою Вієта: x₁ + x₂ = −b, x₁ · x₂ = c.',
   gen(L){const a=rnd(1,9),b=rnd(1,9);return {text:`x² − ${a+b}x + ${a*b} = 0. Знайди більший корінь.`,answer:Math.max(a,b),sol:`За Вієтом: x₁ + x₂ = ${a+b}, x₁ · x₂ = ${a*b}.<br>Підходять ${a} і ${b}. Більший корінь: <b>${Math.max(a,b)}</b>.`}}},
  {id:'div',name:'Ділення',min:2,lesson:'Ділення — обернена дія до множення: 24 ÷ 6 = 4, бо 6 × 4 = 24.',
   gen(L){const b=rnd(2,5+L),r=rnd(2,6+L),a=b*r;return {text:`${a} ÷ ${b} = ?`,answer:r,sol:`Яке число, помножене на ${b}, дає ${a}? ${b} × ${r} = ${a}, тож <b>${r}</b>.`}}},
  {id:'ord',name:'Порядок дій',min:3,lesson:'Спочатку дужки, потім множення й ділення, потім додавання й віднімання.',
   gen(L){const a=rnd(2,6+L),b=rnd(2,6+L),c=rnd(2,9+L);return Math.random()<.5?{text:`${a} + ${b} × ${c} = ?`,answer:a+b*c,sol:`Спершу множення: ${b} × ${c} = ${b*c}.<br>Потім додавання: ${a} + ${b*c} = <b>${a+b*c}</b>.`}:{text:`(${a} + ${b}) × ${c} = ?`,answer:(a+b)*c,sol:`Спершу дужки: ${a} + ${b} = ${a+b}.<br>Потім множення: ${a+b} × ${c} = <b>${(a+b)*c}</b>.`}}},
  {id:'unit',name:'Одиниці вимірювання',min:2,lesson:'1 м = 100 см, 1 км = 1000 м, 1 год = 60 хв, 1 кг = 1000 г.',
   gen(L){const k=rnd(2,9+L),t=pick([['м','см',100],['км','м',1000],['год','хв',60],['кг','г',1000]]);return {text:`${k} ${t[0]} = ? ${t[1]}`,answer:k*t[2],sol:`1 ${t[0]} = ${t[2]} ${t[1]}.<br>${k} × ${t[2]} = <b>${k*t[2]}</b> ${t[1]}.`}}},
  {id:'frac',name:'Частка числа',min:3,lesson:'Щоб знайти 1/n числа, поділи його на n: 1/4 від 20 = 20 ÷ 4 = 5.',
   gen(L){const d=pick([2,3,4,5,10]),k=rnd(2,8+L),n=d*k;return {text:`1/${d} від ${n} = ?`,answer:k,sol:`Ділимо на ${d}: ${n} ÷ ${d} = <b>${k}</b>.`}}},
  {id:'word',name:'Текстові задачі',min:1,lesson:'Прочитай уважно, знайди числа й питання. «Разом» — додавання, «залишилось» — віднімання, «по… у кожній» — множення.',
   gen(L){const a=rnd(5,15+4*L),b=rnd(2,a-1),c=rnd(2,4+L),d=rnd(2,5+L);
    return pick([
     {text:`У Марійки ${a} яблук. Вона віддала ${b}. Скільки яблук залишилось?`,answer:a-b,sol:`«Залишилось» — віднімання: ${a} − ${b} = <b>${a-b}</b>.`},
     {text:`У ${c} коробках по ${d} олівців. Скільки олівців усього?`,answer:c*d,sol:`«По… у кожній» — множення: ${c} × ${d} = <b>${c*d}</b>.`},
     {text:`Тарас прочитав ${a} сторінок, а Олекса — ${b}. Скільки сторінок вони прочитали разом?`,answer:a+b,sol:`«Разом» — додавання: ${a} + ${b} = <b>${a+b}</b>.`}])}},
  {id:'seq',name:'Закономірності',min:1,lesson:'Знайди, на скільки змінюється кожне наступне число, і продовж ряд.',
   gen(L){const s=rnd(1,9+L),d=rnd(2,3+L);return {text:`${s}, ${s+d}, ${s+2*d}, ${s+3*d}, … Яке наступне число?`,answer:s+4*d,sol:`Кожне число більше на ${d}: ${s+3*d} + ${d} = <b>${s+4*d}</b>.`}}},
  {id:'rem',name:'Ділення з остачею',min:5,lesson:'Остача завжди менша за дільник: 17 = 5 × 3 + 2.',
   gen(L){const b=rnd(3,9),q=rnd(3,12),r=rnd(1,b-1),a=b*q+r;return {text:`Яка остача від ділення ${a} на ${b}?`,answer:r,sol:`${a} = ${b} × ${q} + ${r}.<br>Остача: <b>${r}</b>.`}}},
  {id:'fadd',name:'Звичайні дроби',min:5,lesson:'З однаковими знаменниками додаємо чисельники, знаменник лишається.',
   gen(L){const d=rnd(5,12),a=rnd(1,d-3),b=rnd(1,d-a-1);return {text:`${a}/${d} + ${b}/${d} = x/${d}. x = ?`,answer:a+b,sol:`Знаменник лишається ${d}, чисельники додаємо: ${a} + ${b} = <b>${a+b}</b>.`}}},
  {id:'vol',name:'Об’єм паралелепіпеда',min:5,lesson:'V = a × b × c (довжина × ширина × висота).',
   gen(L){const a=rnd(2,6+L),b=rnd(2,6),c=rnd(2,6);return {text:`Паралелепіпед ${a}×${b}×${c} см. Об’єм (см³)?`,answer:a*b*c,sol:`V = ${a} × ${b} × ${c} = <b>${a*b*c}</b> см³.`}}},
  {id:'avg',name:'Середнє арифметичне',min:5,lesson:'Додай усі числа й поділи на їх кількість.',
   gen(L){const m=rnd(10,40),d1=rnd(1,5),d2=rnd(1,5),a=m-d1,b=m+d2,c=m+d1-d2;return {text:`Середнє арифметичне чисел ${a}, ${b}, ${c} = ?`,answer:m,sol:`(${a} + ${b} + ${c}) ÷ 3 = ${3*m} ÷ 3 = <b>${m}</b>.`}}},
  {id:'gcd',name:'НСД',min:6,lesson:'НСД — найбільше число, на яке діляться обидва числа.',
   gen(L){const g=rnd(2,9),a=g*rnd(2,6);let b=g*rnd(2,6);while(b===a)b=g*rnd(2,6);const r=gcd(a,b);return {text:`НСД(${a}, ${b}) = ?`,answer:r,sol:`${a} = ${r} × ${a/r}, ${b} = ${r} × ${b/r}. Більшого спільного дільника немає: <b>${r}</b>.`}}},
  {id:'lcm',name:'НСК',min:6,lesson:'НСК — найменше число, що ділиться на обидва: НСК = a × b ÷ НСД.',
   gen(L){const a=rnd(2,12);let b=rnd(2,12);while(b===a)b=rnd(2,12);const g=gcd(a,b);return {text:`НСК(${a}, ${b}) = ?`,answer:a*b/g,sol:`НСД = ${g}. НСК = ${a} × ${b} ÷ ${g} = <b>${a*b/g}</b>.`}}},
  {id:'neg',name:'Від’ємні числа',min:6,lesson:'Від’ємні числа лежать ліворуч від нуля. Менше мінус більше — результат від’ємний.',
   gen(L){const a=rnd(2,20+L),b=a+rnd(1,15);return Math.random()<.5?{text:`${a} − ${b} = ?`,answer:a-b,sol:`${b} більше за ${a}, тож результат від’ємний: ${b} − ${a} = ${b-a}, відповідь <b>−${b-a}</b>.`}:{text:`−${a} − ${b} = ?`,answer:-(a+b),sol:`Обидва числа від’ємні, додаємо модулі: ${a} + ${b} = ${a+b}, відповідь <b>−${a+b}</b>.`}}},
  {id:'prop',name:'Пропорції',min:6,lesson:'У пропорції a : b = c : x добуток крайніх дорівнює добутку середніх: x = b × c ÷ a.',
   gen(L){const a=rnd(2,9),b=rnd(2,9),k=rnd(2,8);return {text:`Знайди x: ${a} : ${b} = ${a*k} : x`,answer:b*k,sol:`x = ${b} × ${a*k} ÷ ${a} = <b>${b*k}</b>.`}}},
  {id:'coord',name:'Координатна площина',min:6,lesson:'Відстань між точками з однаковим x — це різниця їхніх y (за модулем).',
   gen(L){const x=rnd(-6,6),y1=rnd(-5,3),y2=y1+rnd(2,9);return {text:`A(${x}; ${y1}) і B(${x}; ${y2}). Відстань AB = ?`,answer:y2-y1,sol:`x однакові, тож AB = ${y2} − ${P(y1)} = <b>${y2-y1}</b>.`}}},
  {id:'lin',name:'Лінійні рівняння',min:7,lesson:'Збери x в один бік, числа — в інший. Перенесене число змінює знак.',
   gen(L){const c=rnd(1,5),a=c+rnd(2,5),x=rnd(2,9),b=rnd(1,3),d=(a-c)*x-b;return {text:`${a}x − ${b} = ${co(c)}x + ${d}. x = ?`,answer:x,sol:`${a}x − ${c}x = ${d} + ${b}.<br>${a-c}x = ${d+b}, x = <b>${x}</b>.`}}},
  {id:'fsm',name:'Формули скороченого множення',min:7,lesson:'a² − b² = (a − b)(a + b). Так швидше, ніж рахувати квадрати.',
   gen(L){const p=rnd(11,60),q=p-rnd(1,9);return {text:`${p}² − ${q}² = ?`,answer:p*p-q*q,sol:`(${p} − ${q})(${p} + ${q}) = ${p-q} × ${p+q} = <b>${p*p-q*q}</b>.`}}},
  {id:'sys',name:'Системи рівнянь',min:7,lesson:'Додай рівняння, щоб одна змінна зникла.',
   gen(L){const x=rnd(2,9),y=rnd(1,x-1);return {text:`x + y = ${x+y}, x − y = ${x-y}. x = ?`,answer:x,sol:`Додаємо: 2x = ${2*x}, тож x = <b>${x}</b>.`}}},
  {id:'func',name:'Лінійна функція',min:7,lesson:'y = kx + b: підстав x і порахуй y.',
   gen(L){const k=rnd(2,6),b=rnd(-9,9),x=rnd(-4,8);return {text:`y = ${k}x ${b<0?'− '+(-b):'+ '+b}. Знайди y при x = ${x}.`,answer:k*x+b,sol:`y = ${k} × ${P(x)} ${b<0?'−':'+'} ${Math.abs(b)} = <b>${k*x+b}</b>.`}}},
  {id:'angle',name:'Кути трикутника',min:7,lesson:'Сума кутів трикутника — 180°.',
   gen(L){const a=rnd(30,80),b=rnd(30,80);return {text:`Два кути трикутника: ${a}° і ${b}°. Третій кут (°)?`,answer:180-a-b,sol:`180 − ${a} − ${b} = <b>${180-a-b}</b>°.`}}},
  {id:'sqrt',name:'Квадратні корені',min:8,lesson:'√(a × b) = √a × √b. Якщо добуток — повний квадрат, корінь цілий.',
   gen(L){const k=rnd(2,5),u=rnd(1,3),v=rnd(1,4),p=k*u*u,q=k*v*v,r=k*u*v;return {text:`√(${p} × ${q}) = ?`,answer:r,sol:`${p} × ${q} = ${p*q} = ${r}².<br>√${p*q} = <b>${r}</b>.`}}},
  {id:'pyth',name:'Теорема Піфагора',min:8,lesson:'У прямокутному трикутнику c² = a² + b², де c — гіпотенуза.',
   gen(L){const k=rnd(1,3),t=pick([[3,4,5],[5,12,13],[8,15,17],[7,24,25]]).map(v=>v*k),[a,b,c]=t;return Math.random()<.5?{text:`Катети ${a} і ${b}. Гіпотенуза = ?`,answer:c,sol:`c² = ${a}² + ${b}² = ${a*a+b*b}, c = <b>${c}</b>.`}:{text:`Гіпотенуза ${c}, один катет ${a}. Другий катет = ?`,answer:b,sol:`b² = ${c}² − ${a}² = ${c*c-a*a}, b = <b>${b}</b>.`}}},
  {id:'ineq',name:'Нерівності',min:8,lesson:'Розв’язуємо як рівняння, але отримуємо проміжок. Строга нерівність не включає межу.',
   gen(L){const a=rnd(2,6),b=rnd(1,9),c=rnd(15,50),r=Math.ceil((c-b)/a)-1;return {text:`Найбільше ціле x, для якого ${a}x + ${b} < ${c}`,answer:r,sol:`${a}x < ${c-b}, x < ${+((c-b)/a).toFixed(2)}.<br>Найбільше ціле: <b>${r}</b>.`}}},
  {id:'trap',name:'Площа трапеції',min:8,lesson:'S = (a + b) ÷ 2 × h.',
   gen(L){const a=rnd(2,10),b=a+2*rnd(1,4),h=rnd(2,9);return {text:`Основи трапеції ${a} і ${b}, висота ${h}. Площа?`,answer:(a+b)/2*h,sol:`S = (${a} + ${b}) ÷ 2 × ${h} = ${(a+b)/2} × ${h} = <b>${(a+b)/2*h}</b>.`}}},
  {id:'ap',name:'Арифметична прогресія',min:9,lesson:'aₙ = a₁ + (n − 1)d, де d — крок прогресії.',
   gen(L){const a=rnd(1,15),d=rnd(2,7),n=rnd(5,15);return {text:`a<sub>1</sub> = ${a}, d = ${d}. a<sub>${n}</sub> = ?`,answer:a+(n-1)*d,sol:`a<sub>${n}</sub> = ${a} + ${n-1} × ${d} = <b>${a+(n-1)*d}</b>.`}}},
  {id:'gp',name:'Геометрична прогресія',min:9,lesson:'bₙ = b₁ · qⁿ⁻¹, де q — знаменник.',
   gen(L){const b=rnd(1,5),q=rnd(2,3),n=rnd(3,6);return {text:`b<sub>1</sub> = ${b}, q = ${q}. b<sub>${n}</sub> = ?`,answer:b*q**(n-1),sol:`b<sub>${n}</sub> = ${b} × ${q}<sup>${n-1}</sup> = <b>${b*q**(n-1)}</b>.`}}},
  {id:'trig',name:'Тригонометрія',min:9,lesson:'sin α = протилежний катет ÷ гіпотенуза.',
   gen(L){const s=pick([.6,.8]),c=5*rnd(1,6),r=Math.round(c*s);return {text:`Гіпотенуза ${c}, sin α = ${s}. Протилежний катет = ?`,answer:r,sol:`катет = ${c} × ${s} = <b>${r}</b>.`}}},
  {id:'comb',name:'Комбінаторика',min:9,lesson:'Обрати 2 з n: n(n − 1) ÷ 2. Розставити n предметів у ряд: n! = 1 × 2 × … × n.',
   gen(L){if(Math.random()<.5){const n=rnd(4,12);return {text:`Скількома способами обрати 2 учнів із ${n}?`,answer:n*(n-1)/2,sol:`${n} × ${n-1} ÷ 2 = <b>${n*(n-1)/2}</b>.`}}
    const n=rnd(3,5),f=[1,1,2,6,24,120][n];return {text:`Скількома способами розставити ${n} книжок у ряд?`,answer:f,sol:`${n}! = <b>${f}</b>.`}}},
  {id:'vec',name:'Вектори',min:9,lesson:'Скалярний добуток: x₁x₂ + y₁y₂.',
   gen(L){const x1=rnd(-5,6),y1=rnd(-5,6),x2=rnd(-5,6),y2=rnd(-5,6);return {text:`a(${x1}; ${y1}), b(${x2}; ${y2}). Скалярний добуток a·b = ?`,answer:x1*x2+y1*y2,sol:`${P(x1)}·${P(x2)} + ${P(y1)}·${P(y2)} = <b>${x1*x2+y1*y2}</b>.`}}},
  {id:'logs',name:'Логарифми',min:10,lesson:'log<sub>b</sub> N = k означає b<sup>k</sup> = N.',
   gen(L){const b=pick([2,3,5,10]),k=rnd(2,b>3?3:5);return {text:`log<sub>${b}</sub> ${b**k} = ?`,answer:k,sol:`${b}<sup>${k}</sup> = ${b**k}, тож <b>${k}</b>.`}}},
  {id:'expe',name:'Показникові рівняння',min:10,lesson:'Зведи обидві частини до однієї основи й порівняй показники.',
   gen(L){const b=pick([2,3,5]),k=rnd(2,b>3?3:5);return {text:`${b}<sup>x</sup> = ${b**k}. x = ?`,answer:k,sol:`${b**k} = ${b}<sup>${k}</sup>, тож x = <b>${k}</b>.`}}},
  {id:'der',name:'Похідна',min:10,lesson:'(xⁿ)′ = n·xⁿ⁻¹: коефіцієнт множиться на показник, степінь зменшується на 1.',
   gen(L){const a=rnd(1,5),n=rnd(2,4),x=rnd(1,3),r=a*n*x**(n-1);return {text:`f(x) = ${co(a)}x<sup>${n}</sup>. Знайди f ′(${x}).`,answer:r,sol:`f ′(x) = ${a*n}x<sup>${n-1}</sup>.<br>f ′(${x}) = <b>${r}</b>.`}}},
  {id:'prob',name:'Ймовірність',min:10,lesson:'Ймовірність = сприятливі випадки ÷ усі випадки.',
   gen(L){const n=pick([10,20,50]),p=pick([20,40,50,60,80]),r=n*p/100;return {text:`В урні ${r} червоних і ${n-r} синіх куль. Ймовірність витягти червону (у %)?`,answer:p,sol:`P = ${r}/${n} = <b>${p}%</b>.`}}},
  {id:'pyr',name:'Об’єм піраміди',min:10,lesson:'V = ⅓ × S основи × h.',
   gen(L){const S=rnd(4,30),h=3*rnd(1,5);return {text:`Піраміда: площа основи ${S} см², висота ${h} см. V (см³) = ?`,answer:S*h/3,sol:`V = ⅓ × ${S} × ${h} = <b>${S*h/3}</b> см³.`}}},
  {id:'der2',name:'Похідна многочлена',min:11,lesson:'(x³)′ = 3x², (ax²)′ = 2ax, (bx)′ = b.',
   gen(L){const a=rnd(1,5),b=rnd(1,9),x=rnd(1,3),r=3*x*x+2*a*x+b;return {text:`f(x) = x<sup>3</sup> + ${co(a)}x<sup>2</sup> + ${co(b)}x. f ′(${x}) = ?`,answer:r,sol:`f ′(x) = 3x² + ${2*a}x + ${b}.<br>f ′(${x}) = <b>${r}</b>.`}}},
  {id:'int',name:'Інтеграл',min:11,lesson:'∫(ax + b)dx = ax²/2 + bx. Далі F(верх) − F(низ).',
   gen(L){const a=rnd(1,6),b=rnd(1,9),k=2*rnd(1,4),r=a*k*k/2+b*k;return {text:`∫ від 0 до ${k} (${co(a)}x + ${b}) dx = ?`,answer:r,sol:`F(x) = ${co(a)}x²/2 + ${b}x.<br>F(${k}) − F(0) = ${a*k*k/2} + ${b*k} = <b>${r}</b>.`}}},
  {id:'logeq',name:'Логарифмічні рівняння',min:11,lesson:'log₂(x + a) = n означає x + a = 2ⁿ.',
   gen(L){const a=rnd(1,9),n=rnd(3,6);return {text:`log<sub>2</sub>(x + ${a}) = ${n}. x = ?`,answer:2**n-a,sol:`x + ${a} = 2<sup>${n}</sup> = ${2**n}, x = <b>${2**n-a}</b>.`}}},
  {id:'lim',name:'Границі',min:11,lesson:'Розклади чисельник на множники, скороти дріб, потім підстав значення x.',
   gen(L){const k=rnd(2,9);return {text:`lim<sub>x→${k}</sub> (x² − ${k*k}) / (x − ${k}) = ?`,answer:2*k,sol:`(x − ${k})(x + ${k}) / (x − ${k}) = x + ${k}. При x = ${k}: <b>${2*k}</b>.`}}},
  {id:'cmp',name:'Порівняння чисел',min:1,lesson:'Більше те число, яке стоїть далі при лічбі.',
   gen(L){const a=rnd(8,20+5*L),b=a+pick([-5,-3,-2,-1,1,2,3,5]),m=Math.max(a,b),n=Math.min(a,b);return {text:`Яке число більше: ${a} чи ${b}?`,answer:m,sol:`${m} більше за ${n}. Відповідь: <b>${m}</b>.`}}},
  {id:'half',name:'Половина і подвоєння',min:1,lesson:'Половина — поділити на 2, удвічі більше — помножити на 2.',
   gen(L){const k=rnd(2,10+3*L);return Math.random()<.5?{text:`Половина від ${2*k} = ?`,answer:k,sol:`${2*k} ÷ 2 = <b>${k}</b>.`}:{text:`Удвічі більше за ${k} = ?`,answer:2*k,sol:`${k} × 2 = <b>${2*k}</b>.`}}},
  {id:'miss',name:'Пропущене число',min:1,lesson:'Щоб знайти пропущене число, виконай обернену дію.',
   gen(L){const a=rnd(2,10+8*L),b=rnd(2,10+8*L);return {text:`${a} + □ = ${a+b}. □ = ?`,answer:b,sol:`□ = ${a+b} − ${a} = <b>${b}</b>.`}}},
  {id:'round',name:'Округлення',min:2,lesson:'Дивись на цифру одиниць: 5 і більше — округлюємо вгору, менше — вниз.',
   gen(L){const n=rnd(11,99+100*Math.min(L,8)),r=Math.round(n/10)*10;return {text:`Округли ${n} до десятків.`,answer:r,sol:`${n%10>=5?`Цифра одиниць ${n%10}: округлюємо вгору.`:`Цифра одиниць ${n%10}: округлюємо вниз.`} Відповідь: <b>${r}</b>.`}}},
  {id:'rom',name:'Римські цифри',min:3,lesson:'I = 1, V = 5, X = 10. Менша цифра перед більшою віднімається: IX = 9.',
   gen(L){const n=rnd(4,39+Math.min(L,6)*10);return {text:`Запиши число ${toRoman(n)} арабськими цифрами.`,answer:n,sol:`${toRoman(n)} = <b>${n}</b>.`}}},
  {id:'mulbig',name:'Множення у стовпчик',min:3,lesson:'Множ кожну частину числа окремо й додавай результати.',
   gen(L){const a=rnd(100,999),b=rnd(2,9),h=Math.floor(a/100)*100;return {text:`${a} × ${b} = ?`,answer:a*b,sol:`${h} × ${b} = ${h*b}, ${a-h} × ${b} = ${(a-h)*b}. Разом: <b>${a*b}</b>.`}}},
  {id:'time',name:'Час',min:3,lesson:'1 година = 60 хвилин. Перетвори години у хвилини й додай хвилини.',
   gen(L){const h=rnd(1,5),m=rnd(5,55);return {text:`${h} год ${m} хв = ? хв`,answer:h*60+m,sol:`${h} × 60 = ${h*60}. ${h*60} + ${m} = <b>${h*60+m}</b> хв.`}}},
  {id:'divbig',name:'Ділення багатоцифрових чисел',min:4,lesson:'Ділимо по розрядах і перевіряємо множенням.',
   gen(L){const b=rnd(2,9),r=rnd(20,150),a=b*r;return {text:`${a} ÷ ${b} = ?`,answer:r,sol:`Перевірка: ${b} × ${r} = ${a}. Відповідь: <b>${r}</b>.`}}},
  {id:'mixed',name:'Мішані числа',min:5,lesson:'Ціла частина × знаменник + чисельник — це чисельник неправильного дробу.',
   gen(L){const w=rnd(1,6),d=rnd(2,9),n=rnd(1,d-1);return {text:`Перетвори ${w} ${n}/${d} у неправильний дріб x/${d}. x = ?`,answer:w*d+n,sol:`${w} × ${d} + ${n} = <b>${w*d+n}</b>.`}}},
  {id:'supp',name:'Суміжні кути',min:5,lesson:'Суміжні кути в сумі дають 180°.',
   gen(L){const a=rnd(20,160);return {text:`Суміжний кут до ${a}° (у градусах) = ?`,answer:180-a,sol:`180 − ${a} = <b>${180-a}</b>°.`}}},
  {id:'abs',name:'Модуль числа',min:6,lesson:'Модуль — відстань від нуля, він завжди невід’ємний: |−7| = 7.',
   gen(L){const a=rnd(2,20),b=rnd(2,20);return {text:`|−${a}| + |${b}| = ?`,answer:a+b,sol:`|−${a}| = ${a}, |${b}| = ${b}. Разом <b>${a+b}</b>.`}}},
  {id:'mulneg',name:'Множення від’ємних чисел',min:6,lesson:'Мінус на мінус дає плюс; мінус на плюс дає мінус.',
   gen(L){const a=rnd(2,9),b=rnd(2,9),sa=pick([-1,1]),sb=pick([-1,1]);return {text:`(${sa<0?'−':''}${a}) × (${sb<0?'−':''}${b}) = ?`,answer:sa*sb*a*b,sol:`${sa*sb>0?'Знаки однакові — плюс.':'Знаки різні — мінус.'} ${a} × ${b} = ${a*b}, відповідь <b>${sa*sb*a*b}</b>.`}}},
  {id:'pcof',name:'Скільки відсотків',min:6,lesson:'Відсоток = частина ÷ ціле × 100.',
   gen(L){let a,b,p;do{b=pick([20,25,40,50,200]);p=pick([10,20,25,40,50,60,75]);a=b*p/100}while(!Number.isInteger(a));return {text:`Скільки відсотків число ${a} становить від ${b}?`,answer:p,sol:`${a} ÷ ${b} × 100 = <b>${p}</b>%.`}}},
  {id:'val',name:'Значення виразу',min:7,lesson:'Підстав числа замість букв і виконай дії за порядком.',
   gen(L){const k=rnd(2,6),m=rnd(2,6),a=rnd(2,9),b=rnd(1,9);return {text:`${k}a − ${m}b, якщо a = ${a}, b = ${b}. Значення = ?`,answer:k*a-m*b,sol:`${k} × ${a} − ${m} × ${b} = ${k*a} − ${m*b} = <b>${k*a-m*b}</b>.`}}},
  {id:'distr',name:'Розкриття дужок',min:7,lesson:'a(b + c) = ab + ac: множ число на кожен доданок у дужках.',
   gen(L){const k=rnd(2,9),m=rnd(2,9),x=rnd(2,9);return {text:`${k}(x + ${m}), якщо x = ${x}. Значення = ?`,answer:k*(x+m),sol:`${k}x + ${k*m} = ${k*x} + ${k*m} = <b>${k*(x+m)}</b>.`}}},
  {id:'degr',name:'Правила степенів',min:7,lesson:'a<sup>m</sup> · a<sup>n</sup> = a<sup>m+n</sup>. Показники додаємо.',
   gen(L){const b=pick([2,3,5,7]),m=rnd(2,7),n=rnd(2,7);return {text:`${b}<sup>${m}</sup> · ${b}<sup>${n}</sup> = ${b}<sup>x</sup>. x = ?`,answer:m+n,sol:`${m} + ${n} = <b>${m+n}</b>.`}}},
  {id:'disc',name:'Дискримінант',min:8,lesson:'D = b² − 4ac. Якщо D > 0 — два корені, D = 0 — один, D < 0 — коренів немає.',
   gen(L){const a=rnd(1,4),b=rnd(-9,9)||3,c=rnd(-6,6)||2;return {text:`${co(a)}x² ${b<0?'−':'+'} ${co(Math.abs(b))}x ${c<0?'−':'+'} ${Math.abs(c)} = 0. D = ?`,answer:b*b-4*a*c,sol:`D = ${P(b)}² − 4 × ${a} × ${P(c)} = ${b*b} − ${P(4*a*c)} = <b>${b*b-4*a*c}</b>.`}}},
  {id:'circ',name:'Довжина кола',min:8,lesson:'C = 2πr. Беремо π ≈ 22/7, тому радіус зручно брати кратним 7.',
   gen(L){const r=7*rnd(1,6);return {text:`Радіус кола ${r}. Довжина кола (π ≈ 22/7) = ?`,answer:44*r/7,sol:`C = 2 × 22/7 × ${r} = 44 × ${r/7} = <b>${44*r/7}</b>.`}}},
  {id:'sumap',name:'Сума арифметичної прогресії',min:9,lesson:'S<sub>n</sub> = (2a<sub>1</sub> + (n − 1)d) · n ÷ 2.',
   gen(L){const a=rnd(1,9),d=rnd(1,6),n=rnd(4,12),s=(2*a+(n-1)*d)*n/2;return {text:`a<sub>1</sub> = ${a}, d = ${d}, n = ${n}. S<sub>n</sub> = ?`,answer:s,sol:`S = (2 × ${a} + ${n-1} × ${d}) × ${n} ÷ 2 = <b>${s}</b>.`}}},
  {id:'median',name:'Медіана',min:9,lesson:'Розстав числа за зростанням: медіана — число посередині.',
   gen(L){const v=Array.from({length:5},()=>rnd(1,30)),s=[...v].sort((x,y)=>x-y);return {text:`Медіана чисел ${v.join(', ')} = ?`,answer:s[2],sol:`За зростанням: ${s.join(', ')}. Посередині <b>${s[2]}</b>.`}}},
  {id:'inscr',name:'Вписаний кут',min:9,lesson:'Вписаний кут удвічі менший за центральний, що спирається на ту саму дугу.',
   gen(L){const a=rnd(10,80);return {text:`Центральний кут ${2*a}°. Вписаний кут (у градусах) = ?`,answer:a,sol:`${2*a} ÷ 2 = <b>${a}</b>°.`}}},
  {id:'trigv',name:'Значення тригонометричних виразів',min:10,lesson:'sin 30° = 0,5; cos 60° = 0,5; sin 90° = 1; cos 0° = 1; tg 45° = 1; sin 0° = cos 90° = 0.',
   gen(L){const V=[['sin 30°',.5],['cos 60°',.5],['sin 90°',1],['cos 0°',1],['tg 45°',1],['sin 0°',0],['cos 90°',0]],x=pick(V),y=pick(V),r=x[1]+y[1];return {text:`${x[0]} + ${y[0]} = ?`,answer:r,sol:`${x[0]} + ${y[0]} = ${x[1]} + ${y[1]} = <b>${r}</b>.`}}},
  {id:'logsum',name:'Властивості логарифмів',min:10,lesson:'log<sub>a</sub> x + log<sub>a</sub> y = log<sub>a</sub> (x · y).',
   gen(L){const a=rnd(1,4),b=rnd(1,4);return {text:`log<sub>2</sub> ${2**a} + log<sub>2</sub> ${2**b} = ?`,answer:a+b,sol:`${a} + ${b} = <b>${a+b}</b>.`}}},
  {id:'cyl',name:'Об’єм циліндра',min:10,lesson:'V = π r² h. Відповідь записуємо у вигляді x·π.',
   gen(L){const r=rnd(2,6),h=rnd(2,9);return {text:`Циліндр: r = ${r}, h = ${h}. V = x·π. x = ?`,answer:r*r*h,sol:`x = ${r}² × ${h} = ${r*r} × ${h} = <b>${r*r*h}</b>.`}}},
  {id:'int2',name:'Інтеграл степеня',min:11,lesson:'∫ x² dx = x³/3. Далі F(верх) − F(низ).',

const BANDS=[[0,300,1,2],[300,500,3,4],[500,1000,5,6],[1000,1500,7,8],[1500,2000,9,11],[2000,1e9,5,11]];
const bandInfo=e=>BANDS.find(b=>e<b[1])||BANDS[5];
const band=e=>{const b=bandInfo(e);return [b[2],b[3]]};
const bandTxt=e=>band(e).join('–');
const bandPct=e=>{const b=bandInfo(e);return b[1]>1e8?100:Math.round((e-b[0])/(b[1]-b[0])*100)};
const gradeElo=g=>g<=2?100:g<=4?300:g<=6?500:g<=8?1000:1500;

const botAv=(b,c='sm')=>b.img?`<img class="av ${c}" src="${b.img}" alt="">`:`<span class="av ${c} emo">${b.av}</span>`;
const BASE_BADGES=['∑','♟','π'],BADGES=['∑','♟','π','√','⚡','🔥','🦉','🚀','🏆','🧠','👑'],BOTAV=['🦊','🐼','🦁','🐯','🐸','🦉','🐧','🐙'],FLAGS=['🇺🇦','🇩🇪','🇵🇱','🇬🇧','🇺🇸','🇨🇿'];
const allowedBadges=()=>[...BASE_BADGES,...(save.badges||[])];
const curBadge=()=>allowedBadges().includes(save.badge)?save.badge:'∑';
const TITLES=[
 {id:'t300',name:'Учень',elo:300,color:'#4f8cff'},
 {id:'t500',name:'Знавець',elo:500,color:'#2a9d8f'},
 {id:'t1000',name:'Майстер',elo:1000,color:'#ef476f'},
 {id:'t1500',name:'Еліта',elo:1500,color:'#9b5de5'},
 {id:'t2000',name:'Геній',elo:2000,color:'#f5c518'}
];
const titleHTML=id=>{const t=TITLES.find(x=>x.id===id);return t?`<span class="ttl${t.id==='t2000'?' gold':''}" style="color:${t.color}">${tx(t.name)}</span>`:''};
const titleForElo=e=>{const t=[...TITLES].reverse().find(x=>e>=x.elo);return t?t.id:null};
const nickStyle=()=>isPlus()&&/^#[0-9a-f]{6}$/i.test(save.nickColor||'')?` style="color:${save.nickColor}"`:'';
const meName=()=>`<span${nickStyle()}>${esc(save.name)}</span> <span class="bdg" title="${T('badge')}">${curBadge()}</span>`;
const nameHTML=()=>`<b>${meName()}</b>`;
const meTitle=()=>titleHTML(save.title);
function mkBot(){return {av:pick(BOTAV),badge:pick(BADGES),flag:pick(FLAGS),games:rnd(20,400),winp:rnd(40,70),acc:rnd(65,92)}}
function showOpp(){
 const b=G.bot,m=document.createElement('div');m.className='modal';
 m.innerHTML=`<div class="card"><h3>${T('opp')}</h3><div class="regav">${b.img?`<img class="av lg" src="${b.img}" alt="">`:`<div class="av lg emo">${b.av}</div>`}<div><h2>${esc(G.botName)} <span class="bdg">${b.badge}</span> ${b.flag}</h2>${titleHTML(titleForElo(G.botElo))}<div class="mute">${T('rating')}: <b>${G.botElo}</b> · ${bandTxt(G.botElo)} ${T('grade')}</div></div></div>
 <div class="stats"><div class="stat"><b>${b.games}</b><span class="mute">${T('games')}</span></div><div class="stat"><b>${b.winp}%</b><span class="mute">${T('winrate')}</span></div><div class="stat"><b>${b.acc}%</b><span class="mute">%</span></div></div>
 ${G.opts&&G.opts.coach?'':`<p class="mute">🤖 ${T('botNote')}</p>`}<div class="row" style="margin-top:14px"><button class="primary" id="mc">${T('close')}</button></div></div>`;
 document.body.appendChild(m);m.onclick=e=>{if(e.target===m||e.target.id==='mc')m.remove()};
}

/* ============ ХМАРА: вхід через Google + синхронізація ============
   Щоб увімкнути: створи проєкт на console.firebase.google.com, увімкни Authentication → Google та Firestore,
   додай веб-застосунок і встав його конфіг замість null, наприклад:
   {apiKey:'…',authDomain:'…',projectId:'…',appId:'…'}                                  */
const FIREBASE_CONFIG=null;
let fb=null,fbUser=null,pushT;
const loadScript=src=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)});
const setOnline=n=>{onlineN=n;const el=document.getElementById('onl');if(el)el.textContent=n};
function cloudPush(){if(!fb||!fbUser)return;clearTimeout(pushT);pushT=setTimeout(()=>{try{const c=JSON.parse(JSON.stringify(save));delete c.plus;delete c.plusSrc;delete c.plusPending;fb.db.doc('users/'+fbUser.uid).set(c)}catch(e){}pushProfile()},1500)}
async function pullCloud(){
 const snap=await fb.db.doc('users/'+fbUser.uid).get();
 if(snap.exists){const c=snap.data();delete c.plus;delete c.plusSrc;delete c.plusPending;if((c.played||c.games||0)>=(save.played||save.games||0))save=Object.assign({},save,c)}
 if(!save.name)save.name=fbUser.displayName||'';
 if(!save.avatar&&fbUser.photoURL)save.avatar=fbUser.photoURL;
 persist();pushProfile();
}
function beat(){
 if(!fb||!fbUser)return;
 fb.db.doc('presence/'+fbUser.uid).set({ts:Date.now()}).catch(()=>{});
 fb.db.collection('presence').where('ts','>',Date.now()-70000).limit(500).get().then(sn=>setOnline(sn.size)).catch(()=>{});
}
async function initCloud(){
 if(!FIREBASE_CONFIG||fb)return;
 try{
  const b='https://www.gstatic.com/firebasejs/10.12.2/';
  for(const f of ['app','auth','firestore'])await loadScript(b+'firebase-'+f+'-compat.js');
  firebase.initializeApp(FIREBASE_CONFIG);fb={auth:firebase.auth(),db:firebase.firestore()};
  fb.auth.onAuthStateChanged(async u=>{fbUser=u;
   if(u){try{await pullCloud()}catch(e){}beat();if(!window._hb)window._hb=setInterval(beat,30000)}
   if(view==='home')home()});
 }catch(e){}
}

const GOOGLE_CLIENT_ID='353312862124-ia4vffcn2n3j1vest1ruirf41v91hnqc.apps.googleusercontent.com';
const ADMIN_EMAIL='hamecmarkian@gmail.com';

const loadGSI=()=>gsiP||(gsiP=loadScript('https://accounts.google.com/gsi/client').catch(e=>{gsiP=null;throw e}));
function jwtPayload(t){try{const b=t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'),r=atob(b+'='.repeat((4-b.length%4)%4));return JSON.parse(new TextDecoder().decode(Uint8Array.from(r,c=>c.charCodeAt(0))))}catch(e){return null}}

async function onGoogle(resp){
 const p=resp&&resp.credential?jwtPayload(resp.credential):null;
 // перевірки на боці клієнта: цільова аудиторія, видавець, строк дії, підтверджена пошта
 if(!p||p.aud!==GOOGLE_CLIENT_ID||!/^(https:\/\/)?accounts\.google\.com$/.test(p.iss||'')||!p.sub||(p.exp||0)*1000<Date.now()||p.email_verified!==true||!p.email){toast(T('gFail'));return}

  try{const cr=await fb.auth.signInWithCredential(firebase.auth.GoogleAuthProvider.credential(resp.credential));fbUser=cr.user;await pullCloud()}catch(e){console.warn('Firebase sign-in failed',e)}
 }
 if(save.gid&&save.gid!==p.sub){toast(T('gOther'));return}
 if(!save.gid){
  let stored=null;try{stored=JSON.parse(localStorage.getItem('mindora_g_'+p.sub))}catch(e){}
  if(stored){
   const hasProgress=save.name&&(save.played||save.games||0)>0;
   if(hasProgress&&!confirm(T('gReplace')))return;
   save=Object.assign(freshSave(),stored);
  }
 }
 save.gid=p.sub;save.email=p.email;save.emailOk=true;
 if(!validName(save.name))save.name=[cleanName(p.name),cleanName(p.email.split('@')[0]),'Player'+rnd(100,999)].find(validName);
 if(!save.avatar&&p.picture&&/^https:\/\//.test(p.picture))save.avatar=p.picture;
 persist();gCred=resp.credential;gExp=p.exp;regStep='guest';
 if(pendingG){const f=pendingG;pendingG=null;f();return}
 toast('✅ '+T('gLinked'));tab=save.name?'game':tab;home();syncPlus(true);
}

function beep(k){
 if(save.sound===false)return;
 try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime,f={ok:[660,880],bad:[220,180],win:[523,784]}[k]||[440,440];

ості кроки.":"A good task. Even a black hole can be understood if you break it into simple steps.","Спершу найпростіше, потім ускладнюємо:":"First the simplest part, then we make it harder:","Гарна робота! Навіть Всесвіт кивнув би на знак схвалення.":"Good work! Even the universe would nod in approval.","Не вийшло? Нормально: навіть у фізиці перші теорії часто помилкові. Правильно так:":"Did not work out? That is normal: even in physics the first theories are often wrong. The right answer:","Ще три схожі задачі — для закріплення, як гравітація закріплює галактики.":"Three more similar tasks — to reinforce it, the way gravity holds galaxies together.","Перший крок":"First step","Зіграй свою першу гру.":"Play your first game.","Значок 🌱":"Badge 🌱","Дзвінок на урок":"School bell","Пройди будь-який один урок.":"Complete any one lesson.","Значок 🔔":"Badge 🔔","База":"Foundation","Пройди всі уроки §–§ класу.":"Complete all lessons for grades §–§.","Значок 📘":"Badge 📘","Підліток":"Teenager","Значок 🎒":"Badge 🎒","Повна освіта":"Full education","Значок 🎓":"Badge 🎓","Розгін":"Warm-up","Досягни § Ело.":"Reach § Elo.","Титул «Учень» і значок ⚡":"Title “Student” and badge ⚡","Піднесення":"Rise","Титул «Знавець» і значок 🔥":"Title “Expert” and badge 🔥","Майстерність":"Mastery","Титул «Майстер» і значок 🦉":"Title “Master” and badge 🦉","Вершина":"Summit","Титул «Еліта» і значок 🚀":"Title “Elite” and badge 🚀","Геній":"Genius","Жовтий титул «Геній» і значок 👑":"Yellow title “Genius” and badge 👑","Переможець":"Winner","Виграй § ігор.":"Win § games.","Значок 🏆":"Badge 🏆","Постійність":"Consistency","Грай § днів поспіль.":"Play § days in a row.","Значок 🧠":"Badge 🧠","Математик":"Mathematician","Пройди тему «Квадратні корені».":"Complete the topic “Square roots”.","Значок √":"Badge √","Учень":"Student","Знавець":"Expert","Майстер":"Master","Еліта":"Elite"},"ru":{"Додавання і віднімання":"Сложение и вычитание","Розбивай числа на розряди: § + § = § + § + § = §. Віднімання перевіряй додаванням.":"Разбивай числа на разряды: § + § = § + § + § = §. Вычитание проверяй сложением.","Віднімання перевіряємо додаванням: яке число разом з § дає §?<br>§ + § = §, тож відповідь <b>§</b>.":"Вычитание проверяем сложением: какое число вместе с § даёт §?<br>§ + § = §, значит ответ <b>§</b>.","Спочатку десятки: § + § = §.<br>Потім одиниці: § + § = §.<br>Разом: § + § = <b>§</b>.":"Сначала десятки: § + § = §.<br>Потом единицы: § + § = §.<br>Вместе: § + § = <b>§</b>.","Множення":"Умножение","Таблиця множення + розклад: § × § = §×§ + §×§ = § + § = §.":"Таблица умножения + разбиение: § × § = §×§ + §×§ = § + § = §.","Розбий § на § і §.<br>§ × § = §, § × § = §.<br>Разом: § + § = <b>§</b>.":"Разбей § на § и §.<br>§ × § = §, § × § = §.<br>Вместе: § + § = <b>§</b>.","Рівняння":"Уравнения","Щоб знайти невідоме, зроби обернену дію: x + § = § → x = § − §. Якщо є коефіцієнт — поділи обидві частини.":"Чтобы найти неизвестное, выполни обратное действие: x + § = § → x = § − §. Если есть коэффициент — раздели обе части.","Щоб знайти x, віднімаємо § від обох частин.<br>x = § − § = <b>§</b>.":"Чтобы найти x, вычитаем § из обеих частей.<br>x = § − § = <b>§</b>.","Віднімаємо §: §x = § − § = §.<br>Ділимо на §: x = § ÷ § = <b>§</b>.":"Вычитаем §: §x = § − § = §.<br>Делим на §: x = § ÷ § = <b>§</b>.","Геометрія":"Геометрия","Площа прямокутника = a × b (кількість квадратиків всередині). Периметр = § × (a + b) (довжина обходу навколо).":"Площадь прямоугольника = a × b (количество квадратиков внутри). Периметр = § × (a + b) (длина обхода вокруг).","Прямокутник § см × § см. Знайди площу (число).":"Прямоугольник § см × § см. Найди площадь (число).","Площа S = a × b.<br>S = § × § = <b>§</b> см².":"Площадь S = a × b.<br>S = § × § = <b>§</b> см².","Площа = a × b":"Площадь = a × b","площа":"площадь","периметр":"периметр","об’єм":"объём","Прямокутник § см × § см. Знайди периметр (число).":"Прямоугольник § см × § см. Найди периметр (число).","Периметр P = § × (a + b).<br>P = § × (§ + §) = § × § = <b>§</b> см.":"Периметр P = § × (a + b).<br>P = § × (§ + §) = § × § = <b>§</b> см.","Периметр = § × (a + b)":"Периметр = § × (a + b)","Відсотки":"Проценты","§% — це поділити на §; §% — на §; §% — на §. Інші відсотки складай з цих.":"§% — это деление на §; §% — на §; §% — на §. Другие проценты составляй из этих.","§% від § = ?":"§% от § = ?","§% — це §/§.<br>§ × § ÷ § = <b>§</b>.":"§% — это §/§.<br>§ × § ÷ § = <b>§</b>.","p% від n = n × p ÷ §":"p% от n = n × p ÷ §","частка":"доля","добуток сум":"произведение сумм","відсоток від числа":"процент от числа","Степені й корені":"Степени и корни","a² = a × a. Корінь — обернена дія: √§ = §, бо §² = §.":"a² = a × a. Корень — обратное действие: √§ = §, потому что §² = §.","Яке число в квадраті дає §? § × § = §, тож <b>§</b>.":"Какое число в квадрате даёт §? § × § = §, значит <b>§</b>.","Десяткові дроби":"Десятичные дроби","Записуй числа в стовпчик так, щоб кома стояла під комою.":"Записывай числа в столбик так, чтобы запятая стояла под запятой.","Кома під комою: § + § = <b>§</b>.":"Запятая под запятой: § + § = <b>§</b>.","Квадратні рівняння":"Квадратные уравнения","За теоремою Вієта: x₁ + x₂ = −b, x₁ · x₂ = c.":"По теореме Виета: x₁ + x₂ = −b, x₁ · x₂ = c.","x² − §x + § = §. Знайди більший корінь.":"x² − §x + § = §. Найди больший корень.","За Вієтом: x₁ + x₂ = §, x₁ · x₂ = §.<br>Підходять § і §. Більший корінь: <b>§</b>.":"По Виету: x₁ + x₂ = §, x₁ · x₂ = §.<br>Подходят § и §. Больший корень: <b>§</b>.","Ділення":"Деление","Ділення — обернена дія до множення: § ÷ § = §, бо § × § = §.":"Деление — обратное действие умножению: § ÷ § = §, потому что § × § = §.","Яке число, помножене на §, дає §? § × § = §, тож <b>§</b>.":"Какое число, умноженное на §, даёт §? § × § = §, значит <b>§</b>.","Порядок дій":"Порядок действий","Спочатку дужки, потім множення й ділення, потім додавання й віднімання.":"Сначала скобки, потом умножение и деление, потом сложение и вычитание.","Спершу дужки: § + § = §.<br>Потім множення: § × § = <b>§</b>.":"Сначала скобки: § + § = §.<br>Потом умножение: § × § = <b>§</b>.","Спершу множення: § × § = §.<br>Потім додавання: § + § = <b>§</b>.":"Сначала умножение: § × § = §.<br>Потом сложение: § + § = <b>§</b>.","Одиниці вимірювання":"Единицы измерения","§ м = § см, § км = § м, § год = § хв, § кг = § г.":"§ м = § см, § км = § м, § ч = § мин, § кг = § г.","§ год = ? хв":"§ ч = ? мин","§ год = § хв.<br>§ × § = <b>§</b> хв.":"§ ч = § мин.<br>§ × § = <b>§</b> мин.","§ м = ? см":"§ м = ? см","§ м = § см.<br>§ × § = <b>§</b> см.":"§ м = § см.<br>§ × § = <b>§</b> см.","§ кг = ? г":"§ кг = ? г","§ кг = § г.<br>§ × § = <b>§</b> г.":"§ кг = § г.<br>§ × § = <b>§</b> г.","§ км = ? м":"§ км = ? м","§ км = § м.<br>§ × § = <b>§</b> м.":"§ км = § м.<br>§ × § = <b>§</b> м.","Частка числа":"Доля числа","Щоб знайти §/n числа, поділи його на n: §/§ від § = § ÷ § = §.":"Чтобы найти §/n числа, раздели его на n: §/§ от § = § ÷ § = §.","§/§ від § = ?":"§/§ от § = ?","Ділимо на §: § ÷ § = <b>§</b>.":"Делим на §: § ÷ § = <b>§</b>.","Текстові задачі":"Текстовые задачи","Прочитай уважно, знайди числа й питання. «Разом» — додавання, «залишилось» — віднімання, «по… у кожній» — множення.":"Прочитай внимательно, найди числа и вопрос. «Вместе» — сложение, «осталось» — вычитание, «по… в каждой» — умножение.","У § коробках по § олівців. Скільки олівців усього?":"В § коробках по § карандашей. Сколько карандашей всего?","«По… у кожній» — множення: § × § = <b>§</b>.":"«По… в каждой» — умножение: § × § = <b>§</b>.","Тарас прочитав § сторінок, а Олекса — §. Скільки сторінок вони прочитали разом?":"Тарас прочитал § страниц, а Олекса — §. Сколько страниц они прочитали вместе?","«Разом» — додавання: § + § = <b>§</b>.":"«Вместе» — сложение: § + § = <b>§</b>.","У Марійки § яблук. Вона віддала §. Скільки яблук залишилось?":"У Марийки § яблок. Она отдала §. Сколько яблок осталось?","«Залишилось» — віднімання: § − § = <b>§</b>.":"«Осталось» — вычитание: § − § = <b>§</b>.","Закономірності":"Закономерности","Знайди, на скільки змінюється кожне наступне число, і продовж ряд.":"Найди, на сколько меняется каждое следующее число, и продолжи ряд.","§, §, §, §, … Яке наступне число?":"§, §, §, §, … Какое следующее число?","Кожне число більше на §: § + § = <b>§</b>.":"Каждое число больше на §: § + § = <b>§</b>.","Ділення з остачею":"Деление с остатком","Остача завжди менша за дільник: § = § × § + §.":"Остаток всегда меньше делителя: § = § × § + §.","Яка остача від ділення § на §?":"Какой остаток при делении § на §?","§ = § × § + §.<br>Остача: <b>§</b>.":"§ = § × § + §.<br>Остаток: <b>§</b>.","Звичайні дроби":"Обыкновенные дроби","З однаковими знаменниками додаємо чисельники, знаменник лишається.":"При одинаковых знаменателях складываем числители, знаменатель остаётся.","Знаменник лишається §, чисельники додаємо: § + § = <b>§</b>.":"Знаменатель остаётся §, числители складываем: § + § = <b>§</b>.","Об’єм паралелепіпеда":"Объём параллелепипеда","V = a × b × c (довжина × ширина × висота).":"V = a × b × c (длина × ширина × высота).","Паралелепіпед §×§×§ см. Об’єм (см³)?":"Параллелепипед §×§×§ см. Объём (см³)?","V = § × § × § = <b>§</b> см³.":"V = § × § × § = <b>§</b> см³.","Середнє арифметичне":"Среднее арифметическое","Додай усі числа й поділи на їх кількість.":"Сложи все числа и раздели на их количество.","Середнє арифметичне чисел §, §, § = ?":"Среднее арифметическое чисел §, §, § = ?","НСД":"НОД","НСД — найбільше число, на яке діляться обидва числа.":"НОД — наибольшее число, на которое делятся оба числа.","НСД(§, §) = ?":"НОД(§, §) = ?","§ = § × §, § = § × §. Більшого спільного дільника немає: <b>§</b>.":"§ = § × §, § = § × §. Большего общего делителя нет: <b>§</b>.","НСК":"НОК","НСК — найменше число, що ділиться на обидва: НСК = a × b ÷ НСД.":"НОК — наименьшее число, которое делится на оба: НОК = a × b ÷ НОД.","НСК(§, §) = ?":"НОК(§, §) = ?","НСД = §. НСК = § × § ÷ § = <b>§</b>.":"НОД = §. НОК = § × § ÷ § = <b>§</b>.","Від’ємні числа":"Отрицательные числа","Від’ємні числа лежать ліворуч від нуля. Менш ю целые машины в воображении, прежде чем коснуться металла. Давай так же работать с числами. Выбирай тему!","Розберемо цю задачу, як схему: крок за кроком, нічого зайвого.":"Разберём эту задачу как схему: шаг за шагом, ничего лишнего.","Уяви це в голові — ось послідовність:":"Представь это в голове — вот последовательность:","Бездоганно! Ланцюг замкнено, струм іде!":"Безупречно! Цепь замкнута, ток идёт!","У схемі є розрив, але його легко знайти. Правильна відповідь:":"В схеме есть разрыв, но его легко найти. Правильный ответ:","Тепер випробуємо ще на трьох схожих завданнях — як перевірку нового пристрою.":"Теперь испытаем на ещё трёх похожих заданиях — как проверку нового устройства.","Стівен Гокінг":"Стивен Хокинг","дотепний дослідник космосу":"остроумный исследователь космоса","Привіт. Всесвіт величезний, а математика — його мова. До речі, на гарну партію в мене завжди знайдеться час. Обирай тему!":"Привет. Вселенная огромна, а математика — её язык. Кстати, на хорошую партию у меня всегда найдётся время. Выбирай тему!","Хороша задача. Навіть чорну діру можна зрозуміти, якщо розкласти її на прості кроки.":"Хорошая задача. Даже чёрную дыру можно понять, если разложить её на простые шаги.","Спершу найпростіше, потім ускладнюємо:":"Сначала самое простое, потом усложняем:","Гарна робота! Навіть Всесвіт кивнув би на знак схвалення.":"Хорошая работа! Даже Вселенная кивнула бы в знак одобрения.","Не вийшло? Нормально: навіть у фізиці перші теорії часто помилкові. Правильно так:":"Не получилось? Нормально: даже в физике первые теории часто ошибочны. Правильно так:","Ще три схожі задачі — для закріплення, як гравітація закріплює галактики.":"Ещё три похожие задачи — для закрепления, как гравитация удерживает галактики.","Перший крок":"Первый шаг","Зіграй свою першу гру.":"Сыграй свою первую игру.","Значок 🌱":"Значок 🌱","Дзвінок на урок":"Звонок на урок","Пройди будь-який один урок.":"Пройди любой один урок.","Значок 🔔":"Значок 🔔","База":"База","Пройди всі уроки §–§ класу.":"Пройди все уроки §–§ классов.","Значок 📘":"Значок 📘","Підліток":"Подросток","Значок 🎒":"Значок 🎒","Повна освіта":"Полное образование","Значок 🎓":"Значок 🎓","Розгін":"Разгон","Досягни § Ело.":"Достигни § Эло.","Титул «Учень» і значок ⚡":"Титул «Ученик» и значок ⚡","Піднесення":"Подъём","Титул «Знавець» і значок 🔥":"Титул «Знаток» и значок 🔥","Майстерність":"Мастерство","Титул «Майстер» і значок 🦉":"Титул «Мастер» и значок 🦉","Вершина":"Вершина","Титул «Еліта» і значок 🚀":"Титул «Элита» и значок 🚀","Геній":"Гений","Жовтий титул «Геній» і значок 👑":"Жёлтый титул «Гений» и значок 👑","Переможець":"Победитель","Виграй § ігор.":"Выиграй § игр.","Значок 🏆":"Значок 🏆","Постійність":"Постоянство","Грай § днів поспіль.":"Играй § дней подряд.","Значок 🧠":"Значок 🧠","Математик":"Математик","Пройди тему «Квадратні корені».":"Пройди тему «Квадратные корни».","Значок √":"Значок √","Учень":"Ученик","Знавець":"Знаток","Майстер":"Мастер","Еліта":"Элита"},"de":{"Додавання і віднімання":"Addition und Subtraktion","Розбивай числа на розряди: § + § = § + § + § = §. Віднімання перевіряй додаванням.":"Zerlege Zahlen in Stellenwerte: § + § = § + § + § = §. Prüfe die Subtraktion durch Addition.","Віднімання перевіряємо додаванням: яке число разом з § дає §?<br>§ + § = §, тож відповідь <b>§</b>.":"Subtraktion prüfen wir mit Addition: Welche Zahl ergibt zusammen mit § die §?<br>§ + § = §, also ist die Antwort <b>§</b>.","Спочатку десятки: § + § = §.<br>Потім одиниці: § + § = §.<br>Разом: § + § = <b>§</b>.":"Zuerst die Zehner: § + § = §.<br>Dann die Einer: § + § = §.<br>Zusammen: § + § = <b>§</b>.","Множення":"Multiplikation","Таблиця множення + розклад: § × § = §×§ + §×§ = § + § = §.":"Einmaleins + Zerlegen: § × § = §×§ + §×§ = § + § = §.","Розбий § на § і §.<br>§ × § = §, § × § = §.<br>Разом: § + § = <b>§</b>.":"Zerlege § in § und §.<br>§ × § = §, § × § = §.<br>Zusammen: § + § = <b>§</b>.","Рівняння":"Gleichungen","Щоб знайти невідоме, зроби обернену дію: x + § = § → x = § − §. Якщо є коефіцієнт — поділи обидві частини.":"Um die Unbekannte zu finden, nutze die Umkehroperation: x + § = § → x = § − §. Bei einem Koeffizienten teile beide Seiten.","Щоб знайти x, віднімаємо § від обох частин.<br>x = § − § = <b>§</b>.":"Um x zu finden, subtrahieren wir § auf beiden Seiten.<br>x = § − § = <b>§</b>.","Віднімаємо §: §x = § − § = §.<br>Ділимо на §: x = § ÷ § = <b>§</b>.":"Subtrahiere §: §x = § − § = §.<br>Teile durch §: x = § ÷ § = <b>§</b>.","Геометрія":"Geometrie","Площа прямокутника = a × b (кількість квадратиків всередині). Периметр = § × (a + b) (довжина обходу навколо).":"Fläche eines Rechtecks = a × b (Anzahl der Quadrate darin). Umfang = § × (a + b) (Länge rundherum).","Прямокутник § см × § см. Знайди площу (число).":"Rechteck § cm × § cm. Finde die Fläche (eine Zahl).","Площа S = a × b.<br>S = § × § = <b>§</b> см².":"Fläche S = a × b.<br>S = § × § = <b>§</b> cm².","Площа = a × b":"Fläche = a × b","площа":"Fläche","периметр":"Umfang","об’єм":"Volumen","Прямокутник § см × § см. Знайди периметр (число).":"Rechteck § cm × § cm. Finde den Umfang (eine Zahl).","Периметр P = § × (a + b).<br>P = § × (§ + §) = § × § = <b>§</b> см.":"Umfang P = § × (a + b).<br>P = § × (§ + §) = § × § = <b>§</b> cm.","Периметр = § × (a + b)":"Umfang = § × (a + b)","Відсотки":"Prozente","§% — це поділити на §; §% — на §; §% — на §. Інші відсотки складай з цих.":"§% heißt durch § teilen; §% — durch §; §% — durch §. Andere Prozente setzt du daraus zusammen.","§% від § = ?":"§% von § = ?","§% — це §/§.<br>§ × § ÷ § = <b>§</b>.":"§% sind §/§.<br>§ × § ÷ § = <b>§</b>.","p% від n = n × p ÷ §":"p% von n = n × p ÷ §","частка":"Anteil","добуток сум":"Produkt der Summen","відсоток від числа":"Prozent einer Zahl","Степені й корені":"Potenzen und Wurzeln","a² = a × a. Корінь — обернена дія: √§ = §, бо §² = §.":"a² = a × a. Die Wurzel ist die Umkehroperation: √§ = §, denn §² = §.","Яке число в квадраті дає §? § × § = §, тож <b>§</b>.":"Welche Zahl im Quadrat ergibt §? § × § = §, also <b>§</b>.","Десяткові дроби":"Dezimalbrüche","Записуй числа в стовпчик так, щоб кома стояла під комою.":"Schreibe die Zahlen untereinander, sodass Komma unter Komma steht.","Кома під комою: § + § = <b>§</b>.":"Komma unter Komma: § + § = <b>§</b>.","Квадратні рівняння":"Quadratische Gleichungen","За теоремою Вієта: x₁ + x₂ = −b, x₁ · x₂ = c.":"Nach dem Satz von Vieta: x₁ + x₂ = −b, x₁ · x₂ = c.","x² − §x + § = §. Знайди більший корінь.":"x² − §x + § = §. Finde die größere Lösung.","За Вієтом: x₁ + x₂ = §, x₁ · x₂ = §.<br>Підходять § і §. Більший корінь: <b>§</b>.":"Nach Vieta: x₁ + x₂ = §, x₁ · x₂ = §.<br>Passend sind § und §. Größere Lösung: <b>§</b>.","Ділення":"Division","Ділення — обернена дія до множення: § ÷ § = §, бо § × § = §.":"Division ist die Umkehrung der Multiplikation: § ÷ § = §, denn § × § = §.","Яке число, помножене на §, дає §? § × § = §, тож <b>§</b>.":"Welche Zahl mal § ergibt §? § × § = §, also <b>§</b>.","Порядок дій":"Rechenreihenfolge","Спочатку дужки, потім множення й ділення, потім додавання й віднімання.":"Zuerst Klammern, dann Multiplikation und Division, dann Addition und Subtraktion.","Спершу дужки: § + § = §.<br>Потім множення: § × § = <b>§</b>.":"Zuerst die Klammern: § + § = §.<br>Dann die Multiplikation: § × § = <b>§</b>.","Спершу множення: § × § = §.<br>Потім додавання: § + § = <b>§</b>.":"Zuerst die Multiplikation: § × § = §.<br>Dann die Addition: § + § = <b>§</b>.","Одиниці вимірювання":"Maßeinheiten","§ м = § см, § км = § м, § год = § хв, § кг = § г.":"§ m = § cm, § km = § m, § h = § min, § kg = § g.","§ год = ? хв":"§ h = ? min","§ год = § хв.<br>§ × § = <b>§</b> хв.":"§ h = § min.<br>§ × § = <b>§</b> min.","§ м = ? см":"§ m = ? cm","§ м = § см.<br>§ × § = <b>§</b> см.":"§ m = § cm.<br>§ × § = <b>§</b> cm.","§ кг = ? г":"§ kg = ? g","§ кг = § г.<br>§ × § = <b>§</b> г.":"§ kg = § g.<br>§ × § = <b>§</b> g.","§ км = ? м":"§ km = ? m","§ км = § м.<br>§ × § = <b>§</b> м.":"§ km = § m.<br>§ × § = <b>§</b> m.","Частка числа":"Teil einer Zahl","Щоб знайти §/n числа, поділи його на n: §/§ від § = § ÷ § = §.":"Um §/n einer Zahl zu finden, teile sie durch n: §/§ von § = § ÷ § = §.","§/§ від § = ?":"§/§ von § = ?","Ділимо на §: § ÷ § = <b>§</b>.":"Teile durch §: § ÷ § = <b>§</b>.","Текстові задачі":"Textaufgaben","Прочитай уважно, знайди числа й питання. «Разом» — додавання, «залишилось» — віднімання, «по… у кожній» — множення.":"Lies genau und finde die Zahlen und die Frage. „Zusammen“ heißt Addition, „übrig“ heißt Subtraktion, „je … in jeder“ heißt Multiplikation.","У § коробках по § олівців. Скільки олівців усього?":"In § Schachteln liegen je § Stifte. Wie viele Stifte sind es insgesamt?","«По… у кожній» — множення: § × § = <b>§</b>.":"„Je … in jeder“ heißt Multiplikation: § × § = <b>§</b>.","Тарас прочитав § сторінок, а Олекса — §. Скільки сторінок вони прочитали разом?":"Taras hat § Seiten gelesen und Oleksa §. Wie viele Seiten haben sie zusammen gelesen?","«Разом» — додавання: § + § = <b>§</b>.":"„Zusammen“ heißt Addition: § + § = <b>§</b>.","У Марійки § яблук. Вона віддала §. Скільки яблук залишилось?":"Mariika hat § Äpfel. Sie hat § weggegeben. Wie viele Äpfel sind übrig?","«Залишилось» — віднімання: § − § = <b>§</b>.":"„Übrig“ heißt Subtraktion: § − § = <b>§</b>.","Закономірності":"Muster","Знайди, на скільки змінюється кожне наступне число, і продовж ряд.":"Finde heraus, um wie viel sich jede nächste Zahl ändert, und setze die Reihe fort.","§, §, §, §, … Яке наступне число?":"§, §, §, §, … Welche Zahl kommt als Nächstes?","Кожне число більше на §: § + § = <b>§</b>.":"Jede Zahl ist um § größer: § + § = <b>§</b>.","Ділення з остачею":"Division mit Rest","Остача завжди менша за дільник: § = § × § + §.":"Der Rest ist immer kleiner als der Teiler: § = § × § + §.","Яка остача від ділення § на §?":"Welcher Rest bleibt bei § geteilt durch §?","§ = § × § + §.<br>Остача: <b>§</b>.":"§ = § × § + §.<br>Rest: <b>§</b>.","Звичайні дроби":"Gewöhnliche Brüche","З однаковими знаменниками додаємо чисельники, знаменник лиш n. Die richtige Antwort:","А тепер ще три схожі задачі. Це гімнастика для розуму!":"Und jetzt noch drei ähnliche Aufgaben. Das ist Gymnastik für den Geist!","Нікола Тесла":"Nikola Tesla","винахідник-візіонер":"visionärer Erfinder","Вітаю! Я будую цілі машини в уяві, перш ніж торкнутись металу. Працюймо з числами так само. Обирай тему!":"Gruß! Ich baue ganze Maschinen im Kopf, bevor ich Metall berühre. Arbeiten wir mit Zahlen genauso. Wähle ein Thema!","Розберемо цю задачу, як схему: крок за кроком, нічого зайвого.":"Zerlegen wir diese Aufgabe wie einen Schaltkreis: Schritt für Schritt, nichts Überflüssiges.","Уяви це в голові — ось послідовність:":"Stell es dir im Kopf vor — hier ist die Reihenfolge:","Бездоганно! Ланцюг замкнено, струм іде!":"Makellos! Der Stromkreis ist geschlossen, der Strom fließt!","У схемі є розрив, але його легко знайти. Правильна відповідь:":"Im Schaltkreis gibt es eine Unterbrechung, aber sie ist leicht zu finden. Die richtige Antwort:","Тепер випробуємо ще на трьох схожих завданнях — як перевірку нового пристрою.":"Jetzt testen wir es an drei weiteren ähnlichen Aufgaben — wie bei einem neuen Gerät.","Стівен Гокінг":"Stephen Hawking","дотепний дослідник космосу":"geistreicher Kosmosforscher","Привіт. Всесвіт величезний, а математика — його мова. До речі, на гарну партію в мене завжди знайдеться час. Обирай тему!":"Hallo. Das Universum ist riesig, und Mathematik ist seine Sprache. Übrigens habe ich immer Zeit für eine gute Partie. Wähle ein Thema!","Хороша задача. Навіть чорну діру можна зрозуміти, якщо розкласти її на прості кроки.":"Eine gute Aufgabe. Selbst ein Schwarzes Loch lässt sich verstehen, wenn man es in einfache Schritte zerlegt.","Спершу найпростіше, потім ускладнюємо:":"Zuerst das Einfachste, dann machen wir es schwieriger:","Гарна робота! Навіть Всесвіт кивнув би на знак схвалення.":"Gute Arbeit! Selbst das Universum würde zustimmend nicken.","Не вийшло? Нормально: навіть у фізиці перші теорії часто помилкові. Правильно так:":"Hat nicht geklappt? Das ist normal: Selbst in der Physik sind die ersten Theorien oft falsch. Richtig ist:","Ще три схожі задачі — для закріплення, як гравітація закріплює галактики.":"Noch drei ähnliche Aufgaben — zum Festigen, so wie die Schwerkraft Galaxien zusammenhält.","Перший крок":"Erster Schritt","Зіграй свою першу гру.":"Spiele dein erstes Spiel.","Значок 🌱":"Abzeichen 🌱","Дзвінок на урок":"Schulglocke","Пройди будь-який один урок.":"Schließe eine beliebige Lektion ab.","Значок 🔔":"Abzeichen 🔔","База":"Basis","Пройди всі уроки §–§ класу.":"Schließe alle Lektionen der Klassen §–§ ab.","Значок 📘":"Abzeichen 📘","Підліток":"Teenager","Значок 🎒":"Abzeichen 🎒","Повна освіта":"Volle Bildung","Значок 🎓":"Abzeichen 🎓","Розгін":"Anlauf","Досягни § Ело.":"Erreiche § Elo.","Титул «Учень» і значок ⚡":"Titel „Schüler“ und Abzeichen ⚡","Піднесення":"Aufstieg","Титул «Знавець» і значок 🔥":"Titel „Kenner“ und Abzeichen 🔥","Майстерність":"Meisterschaft","Титул «Майстер» і значок 🦉":"Titel „Meister“ und Abzeichen 🦉","Вершина":"Gipfel","Титул «Еліта» і значок 🚀":"Titel „Elite“ und Abzeichen 🚀","Геній":"Genie","Жовтий титул «Геній» і значок 👑":"Gelber Titel „Genie“ und Abzeichen 👑","Переможець":"Gewinner","Виграй § ігор.":"Gewinne § Spiele.","Значок 🏆":"Abzeichen 🏆","Постійність":"Beständigkeit","Грай § днів поспіль.":"Spiele § Tage in Folge.","Значок 🧠":"Abzeichen 🧠","Математик":"Mathematiker","Пройди тему «Квадратні корені».":"Schließe das Thema „Quadratwurzeln“ ab.","Значок √":"Abzeichen √","Учень":"Schüler","Знавець":"Kenner","Майстер":"Meister","Еліта":"Elite"}};
const TXRE=/<span class="rn">[^<]*<\/span>|[−-]?\d+(?:[.,]\d+)?/g;
function tx(s){
 if(lang==='uk'||typeof s!=='string'||!s)return s;
 const n=[],k=s.replace(TXRE,m=>{n.push(m);return '§'}),t=(TRX[lang]||{})[k];
 if(!t)return s;let i=0;return t.replace(/§/g,()=>n[i++]??'');
}
function trTask(x){x.text=tx(x.text);x.sol=tx(x.sol);if(x.hint)x.hint=tx(x.hint);if(x.words){x.words=x.words.map(tx);x.key=tx(x.key)}return x}
const toRoman=n=>{let r='';[[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']].forEach(([v,s])=>{while(n>=v){r+=s;n-=v}});return `<span class="rn">${r}</span>`};

async function idbPut(k,v){try{const d=await idb();await new Promise(ok=>{const t=d.transaction('f','readwrite');t.objectStore('f').put(v,k);t.oncomplete=ok;t.onerror=ok})}catch(e){}}
async function idbGet(k){try{const d=await idb();return await new Promise(ok=>{const q=d.transaction('f').objectStore('f').get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>ok(null)})}catch(e){return null}}

function pickVideo(cb){
 const f=document.createElement('input');f.type='file';f.accept='video/*';
 f.onchange=()=>{const file=f.files[0];if(!file)return;if(file.size>3e6){toast(T('vidBig'));return}
  const u=URL.createObjectURL(file),v=document.createElement('video');v.preload='metadata';
  v.onloadedmetadata=()=>{URL.revokeObjectURL(u);if(v.duration>5.2){toast(T('vidLong'));return}cb(file)};
  v.onerror=()=>{URL.revokeObjectURL(u);toast(T('vidErr'))};v.src=u};
 f.click();
}

// Нова вкладка: додай рядок (ключ з I) і функцію pane…
const TABS=[['game',()=>paneGame()],['lessons',()=>paneLessons()],['friends',()=>paneFriends()],['profile',()=>paneProfile()],['settings',()=>paneSettings()],['plus',()=>panePlus()],['admin',()=>isAdmin()?paneAdmin():paneGame()],['shop',()=>paneShop()]];
function home(){
 clearInterval(tick);view='home';
 if(!save.name)return register();
 if(!validName(save.name)){regStep='guest';return register()}
 $('#app').innerHTML=`<div class="brand"><span>Mindora</span><button class="plusbtn" id="plusb">${isPlus()?'Plus ✓':'Plus+'}</button><div class="topr"><button class="coinb" id="coinb">🪙 ${coins()}</button><button class="shopb" id="shopb">🛍 Магазин</button></div></div>
<div class="card prof"><div class="prow">${avatarHTML('pav')}<div class="who"><div class="nline">${nameHTML()}</div><div class="nsub">${meTitle()}<span class="streak" title="${T('days')}">🔥 ${streakNow()} ${T('days')}</span></div></div><div class="chip-elo" title="${T('rating')}">${save.elo}</div></div>
<div class="mute pmeta">${bandTxt(save.elo)} ${T('grade')} · ${T('rating')} ${save.elo}</div>${rankBar()}</div>
 <nav class="tabs" role="tablist">${TABS.filter(t=>t[0]!=='plus'&&t[0]!=='shop'&&(t[0]!=='admin'||isAdmin())).map(([id])=>`<button role="tab" aria-selected="${id===tab}" data-t="${id}" class="${id===tab?'on':''}"><span class="ti">${TI[id]||''}</span><span>${tabLabel(id)}</span></button>`).join('')}</nav><div id="pane"></div>`;
 document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;cur=null;home()});
 $('#plusb').onclick=()=>{tab='plus';home()};$('#coinb').onclick=()=>{tab='shop';home()};$('#shopb').onclick=()=>{tab='shop';home()};
 (TABS.find(t=>t[0]===tab)||TABS[0])[1]();
}
function paneGame(){
 const ic={demo:'⚡',blitz:'⏱',std:'🧠'};
 $('#pane').innerHTML=`<div class="online"><span class="dot"></span>${T('online')}: <b id="onl">${onlineN??'—'}</b></div>
 <div class="stats"><div class="stat"><b>${save.games}</b><span class="mute">${T('games')}</span></div><div class="stat"><b>${save.wins}</b><span class="mute">${T('wins')}</span></div><div class="stat"><b>${save.games?Math.round(save.wins/save.games*100):0}%</b><span class="mute">${T('winrate')}</span></div></div>
 <div class="card" style="margin-top:16px"><h2>${T('newDuel')}</h2><div class="mute">${T('rules')}</div>
 <div class="modes">${REGISTRY.modes.map(m=>`<button class="mode ${m.id===modeId?'sel':''}" data-m="${m.id}"><b>${ic[m.id]||'▶'} ${m.sec/60} ${T('min')}</b><span>${T('tasks')}: ${m.tasks} · ±${m.cap} Elo</span></button>`).join('')}</div>
 <button class="primary wide" id="go">${T('find')}</button></div>`;
 document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{modeId=b.dataset.m;paneGame()});
 $('#go').onclick=()=>findMatch();
}

function start(opts){
 opts=opts||{};
 const mode=REGISTRY.modes.find(m=>m.id===modeId),[lo,hi]=band(save.elo),c=opts.coach;S.tasksPerGame=mode.tasks;
 const mk=()=>{
  if(opts.topic||opts.grade){ // дуель з тренером: тільки обрана тема / клас
   let pool=allTopics().filter(t=>(!opts.topic||t.id===opts.topic)&&(!opts.grade||t.grade===opts.grade));if(!pool.length)pool=allTopics();
   const t=pick(pool);return Object.assign({topic:t.gt,topicName:t.name,lvl:t.L,grade:t.grade,lesson:tx(REGISTRY.topics.find(x=>x.id===t.gt).lesson)},genT(t))}
  const g=rnd(lo,hi),pl=REGISTRY.topics.filter(x=>x.min<=g&&x.min>=g-4),t=pick(pl.length?pl:REGISTRY.topics.filter(x=>x.min<=g));
  return Object.assign({topic:t.id,topicName:tx(t.name),lvl:g,grade:g,lesson:tx(t.lesson)},trTask(t.gen(g)))};
 const tasks=opts.tasks||Array.from({length:S.tasksPerGame},mk);
 const botElo=Math.max(0,save.elo+(c?c.delta:rnd(-50,50)+Math.max(-40,Math.min(40,(save.streak||0)*10))));
 const botAcc=Math.min(.98,Math.max(.3,.75+(botElo-save.elo)/400+(Math.random()-.5)*.25));
 const botT=Math.round(mode.sec*(.35+Math.random()*.45));
 G={mode,tasks,i:0,res:[],t0:Date.now(),botElo,botAcc:Math.round(botAcc*100)/100,botRes:Array.from({length:S.tasksPerGame},()=>Math.random()<botAcc?1:0),botT,opts,playerEnd:null,hint:{},
  botName:c?c.name:pick(['Олекса','Марічка','Тарас','Соломія','Богдан','Єва','Данило','Софія','Максим','Іванка','Артем','Оля','Юрко','Надія']),
  bot:c?{img:c.img,badge:'♟',flag:'🎓',games:999,winp:78,acc:92}:mkBot()};
 if(opts.duel)duelSetup(G,opts.duel);view='game';render();clearInterval(tick);tick=setInterval(step,250);
}

/* бал за відповідь: точна = 1, близька = частковий бал (як “точність 87%”) */
function score(given,ans){
 const g=parseFloat(String(given).replace(',','.').replace('−','-').trim());
 if(isNaN(g))return 0;if(Math.abs(g-ans)<1e-9)return 1;
 const rel=Math.abs(g-ans)/Math.max(1,Math.abs(ans));return Math.max(0,1-3*rel)*.6;
}

function takeTyped(){
 const i=$('#ans');if(G.busy||!i||i.value.trim()===''||G.res.length>=G.tasks.length)return;
 const t=G.tasks[G.i],s0=score(i.value,t.answer),hn=!!G.hint[G.i];
 G.res.push({t,given:i.value,pts:s0*(hn?.9:1),ok:s0===1,hint:hn});G.i++;
}
function submit(v){
 if(G.busy)return;
 const t=G.tasks[G.i],s0=score(v,t.answer),hn=!!G.hint[G.i];
 G.res.push({t,given:v,pts:s0*(hn?.9:1),ok:s0===1,hint:hn});G.i++;beep(s0===1?'ok':'bad');
 if(G.i>=S.tasksPerGame){G.playerEnd=elapsed();finish();return}
 G.busy=true;const inp=$('#ans');if(inp){inp.classList.add(s0===1?'okf':'badf');inp.disabled=true}

 if(pa===0&&sc>0)sc=0; // без жодної правильної відповіді перемоги не буває
 if(G.forceLoss)sc=0;
 const old=save.elo;const rated=!(G.opts&&(G.opts.coach||G.opts.duel||G.opts.practice));if(rated)save.elo=newElo(old,G.botElo,sc,G.mode.cap);
 save.played=(save.played||0)+1;
 {const td=dayKey(Date.now());if(save.lastDay!==td){save.dayStreak=save.lastDay===dayKey(Date.now()-864e5)?(save.dayStreak||0)+1:1;save.lastDay=td}}
 if(rated){save.games++;if(sc===1)save.wins++;const st=save.streak||0;save.streak=sc===1?(st>0?st+1:1):sc===0?(st<0?st-1:-1):0}
 G.res.forEach(r=>{const s=save.stats[r.t.topic]||(save.stats[r.t.topic]={n:0,pts:0});s.n++;s.pts+=r.pts});
 REGISTRY.hooks.afterGame.forEach(fn=>{try{fn({save,G,pa,ba,sc})}catch(e){}});
 save.history=[...G.tasks.map((t,i)=>{const r=G.res[i];return {topic:t.topic,topicName:t.topicName,lvl:t.lvl,text:t.text,answer:t.answer,sol:t.sol||'',given:r?r.given:'',pts:r?r.pts:0,ok:r?r.ok:false,hint:r?r.hint:false}}),...(save.history||[])].slice(0,40);
 persist();
 const d=save.elo-old;if(sc===1)beep('win');
 $('#app').innerHTML=`
 <div class="card"><h1>${sc===1?T('win'):sc===0?T('lose'):T('draw')}</h1>
  <div class="vs"><div><div class="mute">${esc(save.name)}</div><div class="big">${pa}%</div><div class="mute">${T('accuracy')} · ${done} ${T('ofN')} ${S.tasksPerGame} ${T('tasksLow')} · ${fmt(end)}</div></div>
  <div><button class="lnk" data-opp>${botAv(G.bot)} ${esc(G.botName)} ${esc(G.bot.badge)} ›</button><div class="big">${ba}%</div><div class="mute">${T('accuracy')} · Elo ${G.botElo}</div></div></div>
  ${rated?`<p>${T('rating')}: ${old} → <b>${save.elo}</b> <span class="${d>=0?'good':'badc'}">(${d>=0?'+':''}${d})</span></p>`:`<p class="mute">${T('unrated')}</p>`}</div>
 <div class="card"><h2>${T('review')}</h2>${oppChip()}<div class="mute">${T('reviewHint')}</div>${G.tasks.map((t,i)=>{const r=G.res[i],p=r?r.pts:0;return `<details class="lesson"><summary><b>${t.text}</b> <span class="${r&&r.ok?'good':'badc'}">${r?Math.round(p*100)+'%'+(r.hint?' · −10% '+T('hintShort'):''):'—'}</span></summary><div>Твоя: <b>${r&&r.given!==''?esc(r.given):'—'}</b> · Правильно: <b>${t.answer}</b></div><div class="steps"><b>Розв’язання</b><br>${t.sol||'—'}</div></details>`}).join('')}</div>
 <div class="row"><button class="primary" id="again">${T('again')}</button><button id="hm">${T('home')}</button></div>`;
 $('#again').onclick=()=>findMatch(G.opts);$('#hm').onclick=home;

/* --- генератори задач, що точно підходять під тему --- */
const AS=m=>()=>{const lo=100*m,hi=1000*m-1;if(Math.random()<.5){const a=rnd(lo,hi-lo),b=rnd(lo,hi-a);return {text:`${a} + ${b} = ?`,answer:a+b,sol:`Додаємо по розрядах: ${a} + ${b} = <b>${a+b}</b>.`}}
 const a=rnd(3*lo,hi),b=rnd(lo,a-lo/2);return {text:`${a} − ${b} = ?`,answer:a-b,sol:`${a} − ${b} = <b>${a-b}</b>. Перевір: ${a-b} + ${b} = ${a}.`}};
const TG={
 g1n:()=>{const n=rnd(2,19),k=rnd(0,2),u=rnd(1,9);return k===0?{text:`Яке число стоїть після ${n}?`,answer:n+1,sol:`${n} + 1 = <b>${n+1}</b>.`}:k===1?{text:`Яке число стоїть перед ${n}?`,answer:n-1,sol:`${n} − 1 = <b>${n-1}</b>.`}:{text:`10 + ${u} = ?`,answer:10+u,sol:`Десяток і ще ${u}: <b>${10+u}</b>.`}},
 g1a:()=>{const a=rnd(2,9),b=rnd(2,Math.min(10,20-a)),s=a+b;return {text:`${a} + ${b} = ?`,answer:s,sol:s>10?`Доповни до 10: ${a} + ${10-a} = 10. Лишилось ${b-(10-a)}: 10 + ${b-(10-a)} = <b>${s}</b>.`:`${a} + ${b} = <b>${s}</b>.`}},
 g1s:()=>{const a=rnd(5,20),b=rnd(1,a-1);return {text:`${a} − ${b} = ?`,answer:a-b,sol:`${a} − ${b} = <b>${a-b}</b>. Перевір: ${a-b} + ${b} = ${a}.`}},
 g1f:()=>{const s=pick([['трикутника',3],['квадрата',4],['прямокутника',4],['п’ятикутника',5],['шестикутника',6]]);return {text:`Скільки сторін у ${s[0]}?`,answer:s[1],sol:`Сторін (і кутів): <b>${s[1]}</b>.`}},
 g2p:L=>{const a=rnd(2,6+L),b=rnd(2,6+L);return {text:`Прямокутник ${a} см × ${b} см. Знайди периметр (число).`,answer:2*(a+b),sol:`P = 2 × (${a} + ${b}) = <b>${2*(a+b)}</b> см.`,words:['площа','периметр','об’єм'],key:'периметр',hint:'Периметр = 2 × (a + b)'}},
 g3s:L=>{const a=rnd(2,6+2*L),b=rnd(2,6+2*L);return {text:`Прямокутник ${a} см × ${b} см. Знайди площу (число).`,answer:a*b,sol:`S = ${a} × ${b} = <b>${a*b}</b> см².`,words:['площа','периметр','об’єм'],key:'площа',hint:'Площа = a × b'}},
 g3m:()=>{if(Math.random()<.5){const a=rnd(2,9),b=rnd(2,9);return {text:`${a} × ${b} = ?`,answer:a*b,sol:`${a} × ${b} = <b>${a*b}</b>.`}}const b=rnd(2,9),r=rnd(2,9);return {text:`${b*r} ÷ ${b} = ?`,answer:r,sol:`${b} × ${r} = ${b*r}, тож <b>${r}</b>.`}},
 g3n:AS(1),g4b:AS(10)
};
const co=a=>a===1?'':a;
TG.g2a=()=>{if(Math.random()<.5){const a=rnd(11,89),b=rnd(10,100-a),ta=Math.floor(a/10)*10,tb=Math.floor(b/10)*10;return {text:`${a} + ${b} = ?`,answer:a+b,sol:`Десятки: ${ta} + ${tb} = ${ta+tb}. Одиниці: ${a-ta} + ${b-tb} = ${a-ta+b-tb}. Разом <b>${a+b}</b>.`}}
 const a=rnd(30,99),b=rnd(10,a-5);return {text:`${a} − ${b} = ?`,answer:a-b,sol:`${a} − ${b} = <b>${a-b}</b>. Перевір: ${a-b} + ${b} = ${a}.`}};

function mkDuelTasks(c){

 Math.random=()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}; // однакові задачі в обох
 try{let pool=allTopics().filter(t=>t.grade>=g1&&t.grade<=g2&&(!topic||t.id===topic));if(!pool.length)pool=allTopics();
